<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词汇记忆训练 - 中考核心词汇</title>
<style>
/* ===== CSS Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4F46E5;--primary-light:#6366F1;--primary-dark:#3730A3;--primary-bg:#EEF2FF;
  --success:#10B981;--success-bg:#ECFDF5;--danger:#EF4444;--danger-bg:#FEF2F2;
  --warning:#F59E0B;--warning-bg:#FFFBEB;--amber:#F59E0B;
  --bg:#F0F2F5;--card:#FFFFFF;--text:#1F2937;--text-secondary:#6B7280;--text-light:#9CA3AF;
  --border:#E5E7EB;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);--shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --shadow-xl:0 20px 25px rgba(0,0,0,.1),0 10px 10px rgba(0,0,0,.04);
  --radius-sm:6px;--radius:10px;--radius-lg:16px;--radius-xl:24px;
  --transition:0.2s ease;--transition-slow:0.4s cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
/* ===== Header & Navigation ===== */
.app-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:0;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header-logo{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.header-logo .icon{font-size:1.6rem}
.header-stats{display:flex;gap:12px;font-size:.8rem;opacity:.9}
.header-stats span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;white-space:nowrap}
.nav-bar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99;box-shadow:var(--shadow-sm)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:14px 20px;font-size:.9rem;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;transition:var(--transition);white-space:nowrap;display:flex;align-items:center;gap:6px;user-select:none}
.nav-tab:hover{color:var(--primary);background:var(--primary-bg)}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.nav-tab .badge{background:var(--danger);color:#fff;font-size:.65rem;padding:1px 6px;border-radius:10px;font-weight:700}
/* ===== Main Container ===== */
.main-container{max-width:1200px;margin:0 auto;padding:20px}
.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.8)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes confetti{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(-120px) rotate(720deg)}}
@keyframes starBurst{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
/* ===== Card ===== */
.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);transition:var(--transition);border:1px solid var(--border)}
.card:hover{box-shadow:var(--shadow-md)}
.card-header{font-weight:700;font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);box-shadow:var(--shadow-md)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#DC2626}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#D97706}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-bg)}
.btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:var(--radius-sm)}
.btn-lg{padding:14px 28px;font-size:1.05rem;border-radius:var(--radius)}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%;font-size:1.2rem}
/* ===== Forms ===== */
.input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius);font-size:.9rem;transition:var(--transition);font-family:inherit;background:var(--card)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.input.wrong{border-color:var(--danger);background:var(--danger-bg)}
.input.correct{border-color:var(--success);background:var(--success-bg)}
/* ===== Tags / Labels ===== */
.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
.tag-primary{background:var(--primary-bg);color:var(--primary)}
.tag-success{background:var(--success-bg);color:var(--success)}
.tag-warning{background:var(--warning-bg);color:var(--warning)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.pos-tag{background:#E0E7FF;color:var(--primary);font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:600}
/* ===== Grid ===== */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
/* ===== Word Card ===== */
.word-card{cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}
.word-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.word-card .word-en{font-size:1.3rem;font-weight:700;color:var(--primary);font-family:"Segoe UI",monospace}
.word-card .word-zh{font-size:.85rem;color:var(--text-secondary);margin-top:4px}
.word-card .word-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.word-card.mastered{border-left:4px solid var(--success)}
.word-card.learning{border-left:4px solid var(--warning)}
.word-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);animation:slideUp .3s ease}
.word-detail.open{display:block}
/* ===== Flashcard ===== */
.flashcard-container{perspective:1000px;width:100%;max-width:400px;margin:0 auto;height:280px}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:var(--shadow-lg)}
.flashcard-front{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.flashcard-front .fc-word{font-size:2.5rem;font-weight:800;margin-bottom:8px}
.flashcard-front .fc-hint{font-size:.85rem;opacity:.7}
.flashcard-back{background:var(--card);transform:rotateY(180deg);overflow-y:auto;text-align:center}
.flashcard-back .fc-detail{font-size:.9rem;color:var(--text-secondary)}
/* ===== Quiz ===== */
.quiz-progress{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.quiz-progress-dot{width:24px;height:4px;border-radius:2px;background:var(--border);transition:var(--transition)}
.quiz-progress-dot.done{background:var(--primary)}
.quiz-progress-dot.wrong-q{background:var(--danger)}
.quiz-progress-dot.correct-q{background:var(--success)}
.quiz-question-card{text-align:center;padding:30px}
.quiz-question-card .q-word{font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:8px}
.quiz-question-card .q-hint{color:var(--text-secondary);margin-bottom:20px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.quiz-options{grid-template-columns:1fr}}
.quiz-option{padding:14px 18px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--transition);font-size:.95rem;text-align:center;background:var(--card)}
.quiz-option:hover{border-color:var(--primary);background:var(--primary-bg)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-bg);font-weight:600}
.quiz-option.correct-ans{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.quiz-option.wrong-ans{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);animation:shake .4s}
.quiz-option:disabled{cursor:default;pointer-events:none}
/* ===== Match Game ===== */
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:800px;margin:0 auto}
@media(max-width:600px){.match-grid{grid-template-columns:repeat(3,1fr);gap:8px}}
.match-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:var(--radius);font-weight:600;cursor:pointer;transition:var(--transition);border:2px solid var(--border);background:var(--card);font-size:.85rem;user-select:none}
.match-cell:hover{transform:scale(1.03);box-shadow:var(--shadow-md)}
.match-cell.selected-en{border-color:var(--primary);background:var(--primary-bg);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.match-cell.selected-zh{border-color:var(--warning);background:var(--warning-bg);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.match-cell.matched{background:var(--success-bg);border-color:var(--success);opacity:.6;pointer-events:none;animation:popIn .4s}
.match-cell.wrong-flash{animation:shake .4s;border-color:var(--danger)}
/* ===== Cloze ===== */
.cloze-passage{font-size:1.05rem;line-height:2;text-align:justify}
.cloze-blank{display:inline-block;min-width:80px;border-bottom:2px dashed var(--primary);margin:0 4px;padding:2px 8px;font-weight:700;color:var(--primary);cursor:pointer;transition:var(--transition);position:relative}
.cloze-blank:hover{background:var(--primary-bg)}
.cloze-blank.answered{border-bottom-style:solid;border-color:var(--success);color:var(--success)}
.cloze-blank.wrong-blank{border-color:var(--danger);color:var(--danger)}
.cloze-blank .blank-num{font-size:.6rem;position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:var(--text-light)}
.cloze-options-panel{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cloze-opt-btn{padding:6px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;transition:var(--transition);background:var(--card)}
.cloze-opt-btn:hover{border-color:var(--primary);background:var(--primary-bg)}
.cloze-opt-btn.chosen{border-color:var(--primary);background:var(--primary);color:#fff}
/* ===== Stats ===== */
.stat-card{text-align:center;padding:24px 16px}
.stat-value{font-size:2.5rem;font-weight:800;color:var(--primary)}
.stat-label{font-size:.8rem;color:var(--text-secondary);margin-top:4px}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--success));border-radius:4px;transition:width .6s ease}
/* ===== Donut Chart ===== */
.donut-container{position:relative;width:120px;height:120px;margin:0 auto}
.donut-ring{transform:rotate(-90deg)}
.donut-ring .bg{fill:none;stroke:var(--border);stroke-width:8}
.donut-ring .fill{fill:none;stroke:var(--primary);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.donut-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5rem;font-weight:800;color:var(--primary)}
/* ===== Day Level ===== */
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.day-level-card{padding:16px;text-align:center;border-radius:var(--radius);background:var(--card);border:2px solid var(--border);cursor:pointer;transition:var(--transition)}
.day-level-card:hover:not(.locked){transform:translateY(-2px);box-shadow:var(--shadow-md)}
.day-level-card.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.day-level-card.completed{border-color:var(--success)}
.day-level-card .day-num{font-size:1.5rem;font-weight:800;color:var(--primary)}
.day-level-card .day-stars{font-size:1.2rem;margin-top:4px}
.day-level-card .day-count{font-size:.75rem;color:var(--text-secondary)}
/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:var(--radius-lg);padding:30px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:popIn .3s}
.modal-title{font-size:1.3rem;font-weight:700;margin-bottom:16px}
.modal-close{float:right;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary)}
/* ===== Toast ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-weight:600;animation:slideIn .3s;box-shadow:var(--shadow-lg);font-size:.9rem}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
/* ===== Particles ===== */
.particle{position:fixed;pointer-events:none;z-index:250;font-size:1.5rem;animation:confetti 1s ease forwards}
/* ===== Search ===== */
.search-bar{position:relative;margin-bottom:16px}
.search-bar .input{padding-left:40px}
.search-bar .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-light)}
/* ===== Timer ===== */
.timer{display:flex;align-items:center;gap:6px;font-weight:700;font-size:1.1rem}
.timer.urgent{color:var(--danger);animation:pulse 1s infinite}
/* ===== Responsive ===== */
@media(max-width:768px){
  .header-logo{font-size:1.1rem}
  .header-stats{display:none}
  .nav-tab{padding:10px 14px;font-size:.8rem}
  .nav-tab .tab-label{display:none}
  .nav-tab .tab-icon{font-size:1.2rem}
  .main-container{padding:12px}
  .card{padding:14px}
  .flashcard-container{max-width:300px;height:220px}
  .flashcard-front .fc-word{font-size:1.8rem}
  .quiz-question-card .q-word{font-size:1.5rem}
  .stat-value{font-size:1.8rem}
}
@media(max-width:480px){
  .nav-tab{padding:10px 12px;font-size:.75rem}
  .btn{padding:8px 14px;font-size:.8rem}
}
/* ===== Utility ===== */
.text-center{text-align:center}
.text-right{text-align:right}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.flex-center{align-items:center;justify-content:center}
.gap-1{gap:8px}.gap-2{gap:16px}.gap-3{gap:24px}
.hidden{display:none!important}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}
.fw-bold{font-weight:700}
.word-en-style{font-family:"Segoe UI","Cascadia Code",Consolas,monospace;font-weight:600}
/* ===== Day Map ===== */
.day-map-header{text-align:center;padding:20px 0 10px}
.day-map-header h2{font-size:1.6rem;margin-bottom:4px}
.day-map-header .subtitle{color:var(--text-secondary);font-size:.9rem}
.day-map-stats{display:flex;justify-content:center;gap:24px;margin:12px 0;flex-wrap:wrap}
.day-map-stats .stat-item{text-align:center;padding:8px 16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.day-map-stats .stat-num{font-size:1.4rem;font-weight:800;color:var(--primary)}
.day-map-stats .stat-label{font-size:.7rem;color:var(--text-secondary)}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 0}
.day-card{background:var(--card);border-radius:var(--radius-lg);padding:18px 14px;text-align:center;cursor:pointer;transition:all .25s ease;border:2px solid var(--border);position:relative;overflow:hidden;user-select:none}
.day-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.day-card.locked{opacity:.55;cursor:not-allowed;filter:grayscale(30%)}
.day-card.locked:hover{transform:none;box-shadow:var(--shadow)}
.day-card.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.day-card.completed{border-color:var(--success);background:linear-gradient(135deg,#f0fdf4,#fff)}
.day-card .day-num{font-size:1.1rem;font-weight:800;color:var(--primary)}
.day-card.locked .day-num{color:var(--text-light)}
.day-card .day-label{font-size:.7rem;color:var(--text-secondary);margin:2px 0}
.day-card .day-words{font-size:.7rem;color:var(--text-light)}
.day-card .day-stars{font-size:1.1rem;margin-top:6px;letter-spacing:2px}
.day-card .day-badge{position:absolute;top:8px;right:8px;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:10px}
.day-card .day-badge.doing{background:var(--primary-bg);color:var(--primary)}
.day-card .day-badge.new{background:var(--success-bg);color:var(--success)}
/* ===== Day Detail ===== */
.day-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.day-detail-header .back-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--card);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.day-detail-header .back-btn:hover{background:var(--bg);border-color:var(--primary)}
.day-detail-header .day-title{font-size:1.3rem;font-weight:700}
.day-detail-header .day-subtitle{font-size:.8rem;color:var(--text-secondary)}
/* ===== Step Progress ===== */
.step-progress-bar{display:flex;align-items:center;justify-content:center;gap:0;margin:16px 0 24px;flex-wrap:wrap}
.step-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;background:var(--bg);border:2px solid var(--border);color:var(--text-light);transition:all .3s ease;position:relative}
.step-dot.done{background:var(--success);border-color:var(--success);color:#fff}
.step-dot.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.15);animation:pulse 2s infinite}
.step-dot .step-label{position:absolute;bottom:-22px;font-size:.6rem;font-weight:600;white-space:nowrap;color:var(--text-secondary)}
.step-line{width:28px;height:2px;background:var(--border);flex-shrink:0}
.step-line.done{background:var(--success)}
@media(max-width:600px){.step-dot{width:30px;height:30px;font-size:.75rem}.step-line{width:16px}}
/* ===== Step Content ===== */
.step-content{min-height:300px}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
/* ===== Sentence Exercise ===== */
.sentence-exercise{background:var(--card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);border-left:4px solid var(--primary);margin-bottom:14px}
.sentence-exercise .sent-text{font-size:1.15rem;line-height:1.8;color:var(--text);margin-bottom:8px}
.sentence-exercise .sent-text .blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--primary);margin:0 4px;padding:2px 8px;color:var(--primary);font-weight:700;text-align:center;transition:var(--transition);cursor:pointer}
.sentence-exercise .sent-text .blank.filled{background:var(--primary-bg);border-bottom-style:solid}
.sentence-exercise .sent-text .blank.correct{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.sentence-exercise .sent-text .blank.wrong{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.sentence-exercise .sent-hint{font-size:.8rem;color:var(--text-light)}
.sentence-exercise .sent-pos{display:inline-block;font-size:.7rem;background:var(--primary-bg);color:var(--primary);padding:2px 8px;border-radius:10px;margin-bottom:8px}
/* ===== Choice Grid ===== */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice-btn{padding:14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:.95rem;font-weight:600;transition:all .2s ease;text-align:center}
.choice-btn:hover{border-color:var(--primary);background:var(--primary-bg)}
.choice-btn.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.choice-btn.correct{border-color:var(--success);background:var(--success-bg);color:#065f46}
.choice-btn.wrong{border-color:var(--danger);background:var(--danger-bg);color:#991b1b}
.choice-btn:disabled{cursor:default;opacity:.8}
/* ===== Match Grid in Day Flow ===== */
.match-pair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.match-pair-card{padding:14px 10px;border:2px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;transition:all .2s ease;font-weight:600;font-size:.85rem;user-select:none;background:var(--card)}
.match-pair-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.match-pair-card.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);box-shadow:0 0 0 2px rgba(79,70,229,.2)}
.match-pair-card.matched{border-color:var(--success);background:var(--success-bg);color:#065f46;opacity:.6;pointer-events:none}
.match-pair-card.wrong-pair{animation:shake .4s ease;border-color:var(--danger)!important;background:var(--danger-bg)!important}
.match-pair-card.eng{background:linear-gradient(135deg,#eef2ff,#e0e7ff)}
.match-pair-card.chn{background:linear-gradient(135deg,#fefce8,#fef9c3)}
/* ===== Day Complete Overlay ===== */
.day-complete-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.day-complete-card{background:var(--card);border-radius:var(--radius-xl);padding:32px 24px;text-align:center;max-width:400px;width:90%;animation:popIn .5s ease;box-shadow:var(--shadow-xl)}
.day-complete-card .big-emoji{font-size:4rem;animation:starBurst .6s ease}
.day-complete-card .stars-display{font-size:2.5rem;letter-spacing:6px;margin:12px 0}
.day-complete-card .score-text{font-size:1.1rem;color:var(--text-secondary);margin:8px 0}
/* ===== Spell Input in Day Flow ===== */
.spell-input-row{display:flex;gap:10px;align-items:center}
.spell-input-row .input{flex:1;font-size:1.1rem;font-family:"Segoe UI",Consolas,monospace}
/* ===== Day Overview Stats ===== */
.day-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:16px 0}
.day-overview-item{text-align:center;padding:10px;background:var(--bg);border-radius:var(--radius)}
.day-overview-item .ov-num{font-size:1.3rem;font-weight:800;color:var(--primary)}
.day-overview-item .ov-label{font-size:.65rem;color:var(--text-secondary)}
</style>
</head>

// STATE MANAGEMENT
// ============================================================
const LS_KEY = 'eng_vocab_app_v2';
let appState = loadState();

function defaultState() {
  return {
    wordMastery: {},       // {wordId: 0|1|2}  0=未学, 1=学习中, 2=已掌握
    quizHistory: [],       // [{mode, score, total, date}]
    clozeResults: {},      // {passageId: {score, total, date}}
    wrongWords: [],        // [wordId, ...]
    streak: { current: 0, best: 0, lastDate: '' },
    dayProgress: {},       // {dayNum: {unlocked, completed, stars, currentStep, steps: {1:{}, 2:{score,total}, ...}}}
    spellHistory: [],
    matchBest: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // Merge with defaults for forward compatibility
      const def = defaultState();
      for (const key of Object.keys(def)) {
        if (!(key in saved)) saved[key] = def[key];
      }
      return saved;
    }
  } catch(e) {}
  return defaultState();
}

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(appState));
  } catch(e) {}
}

function updateStreak() {
  const today = new Date().toISOString().slice(0,10);
  if (appState.streak.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (appState.streak.lastDate === yesterday) {
    appState.streak.current++;
  } else if (appState.streak.lastDate !== today) {
    appState.streak.current = 1;
  }
  appState.streak.lastDate = today;
  if (appState.streak.current > appState.streak.best) {
    appState.streak.best = appState.streak.current;
  }
  saveState();
}

function getLearnedCount() {
  return Object.values(appState.wordMastery).filter(v => v > 0).length;
}

function getMasteredCount() {
  return Object.values(appState.wordMastery).filter(v => v === 2).length;
}

  currentPage = page;
  // Update nav tabs
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.page === page);
  });
  // Update pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.add('active');
  // Render
  renderPage(page);
  // Update hash
  if (location.hash !== '#' + page) {
    history.pushState(null, '', '#' + page);
  }
}

function renderPage(page) {
  switch(page) {
    case 'daily-learn':
      if (currentView === 'detail') renderDayDetail(currentDay);
      else renderDayMap();
      break;
    case 'cloze': renderClozePage(); break;
    case 'stats': renderStatsPage(); break;
  }
  updateHeaderStats();
}

// ============================================================
// HELPER: Get words grouped by day
// ============================================================
function getWordsByDay() {
  const map = {};
  WORDS.forEach(w => {
    if (!map[w.day]) map[w.day] = [];
    map[w.day].push(w);
  });
  return map;
}

function getWordById(id) {
  return WORDS.find(w => w.id === id);
}

function getDerivativeDef(derivWord, parentWord) {
  // 1. Try standalone WORDS lookup
  var found = WORDS.find(function(w) { return w.word.toLowerCase() === derivWord.toLowerCase(); });
  if (found && found.meanings && found.meanings.length > 0) return found.meanings[0].def;
  // 2. Try parsing parent word's notes field
  if (parentWord && parentWord.notes) {
    var notes = parentWord.notes;
    var idx = notes.toLowerCase().indexOf(derivWord.toLowerCase());
    if (idx !== -1) {
      var after = notes.substring(idx + derivWord.length);
      // Skip past " n.", " v.", " adj.", " adv.", etc.
      var m = after.match(/^(\s*(?:n\.|v\.|adj\.|adv\.|prep\.|vt\.|vi\.|vt\.\s*&\s*vi\.|pron\.|conj\.|int\.|num\.|art\.)?\s*)([\s\S]+?)(?=[;,；，]|$)/);
      if (m && m[2].trim()) return m[2].trim();
      // Simpler: just take the rest after the word
      var rest = after.replace(/^[\s.]*/, '').split(/[;,；，]/)[0].trim();
      if (rest && rest.length < 30) return rest;
    }
  }
  return null;
}

function getRandomDistractors(correctWord, count=3) {
  const others = WORDS.filter(w => w.id !== correctWord.id);
  const shuffled = others.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

function getDayWords(dayNum) {
  return WORDS.filter(function(w) { return w.day === dayNum; });
}


// ============================================================
// DAY-BASED LEARNING STATE
// ============================================================
let currentView = 'map';
let currentDay = 1;
let currentStep = 1;
const STEP_INFO = [
  { icon: '📖', label: '词汇记忆', key: 'learn' },
  { icon: '✍️', label: '语境填空', key: 'fillblank' },
  { icon: '🎯', label: '选择练习', key: 'quiz' },
  { icon: '📝', label: '拼写练习', key: 'spell' },
  { icon: '🔗', label: '配对游戏', key: 'match' }
];

function getDayProgress(dayNum) {
  if (!appState.dayProgress[dayNum]) {
    appState.dayProgress[dayNum] = { unlocked: dayNum === 1, completed: false, stars: 0, currentStep: 1, steps: {} };
  }
  return appState.dayProgress[dayNum];
}

function unlockNextDay(currentDayNum) {
  var next = currentDayNum + 1;
  if (next <= 19) { getDayProgress(next).unlocked = true; saveState(); }
}

function getDayExerciseData(dayNum) {
  return (typeof DAY_EXERCISES !== 'undefined' && DAY_EXERCISES[dayNum]) ? DAY_EXERCISES[dayNum] : [];
}

// ============================================================
// DAY MAP (Home Page)
// ============================================================
function renderDayMap() {
  currentView = 'map';
  var container = document.getElementById('page-daily-learn');
  var wordsByDay = getWordsByDay();
  var days = Object.keys(wordsByDay).map(Number).sort(function(a,b){return a-b;});
  var totalLearned = getLearnedCount();
  var totalMastered = getMasteredCount();
  var completedDays = 0;
  for (var dk in appState.dayProgress) { if (appState.dayProgress[dk].completed) completedDays++; }

  var h = '';
  h += '<div class="day-map-header"><h2>📅 每日学习</h2><p class="subtitle">每天学习一组词汇，循序渐进，逐天解锁</p></div>';
  h += '<div class="day-map-stats">';
  h += '<div class="stat-item"><div class="stat-num">' + totalLearned + '</div><div class="stat-label">已学单词 / 198</div></div>';
  h += '<div class="stat-item"><div class="stat-num">' + totalMastered + '</div><div class="stat-label">已掌握</div></div>';
  h += '<div class="stat-item"><div class="stat-num">' + completedDays + '</div><div class="stat-label">已完成 / ' + days.length + ' 天</div></div>';
  h += '<div class="stat-item"><div class="stat-num">🔥 ' + appState.streak.current + '</div><div class="stat-label">连续天数</div></div>';
  h += '</div>';

  h += '<div class="day-grid">';
  for (var di = 0; di < days.length; di++) {
    var d = days[di];
    var dp = getDayProgress(d);
    var dayWords = wordsByDay[d];
    var unlocked = dp.unlocked;
    var completed = dp.completed;
    var stars = dp.stars || 0;
    var inProgress = unlocked && !completed && (dp.currentStep > 1 || Object.keys(dp.steps).length > 0);
    var cardClass = '';
    var badgeHtml = '';
    if (!unlocked) {
      cardClass = 'locked';
      badgeHtml = '<span class="day-badge" style="background:#FEE2E2;color:#DC2626">🔒</span>';
    } else if (completed) {
      cardClass = 'completed';
    } else if (inProgress) {
      cardClass = 'current';
      badgeHtml = '<span class="day-badge doing">进行中</span>';
    } else {
      badgeHtml = '<span class="day-badge new">新!</span>';
    }
    var starsStr = completed ? ('⭐'.repeat(Math.max(1, stars)) + '☆'.repeat(Math.max(0, 3 - Math.max(1, stars)))) : '☆☆☆';
    var animDelay = (0.3 + di * 0.03).toFixed(2);
    h += '<div class="day-card ' + cardClass + '" style="animation:slideUp ' + animDelay + 's ease both" onclick="' + (unlocked ? "openDay(" + d + ")" : "showToast('请先完成前一天的练习','info')") + '">';
    h += badgeHtml;
    h += '<div class="day-num">Day ' + d + '</div>';
    h += '<div class="day-label">' + dayWords.length + ' 个单词</div>';
    h += '<div class="day-stars" style="color:' + (completed ? '#F59E0B' : '#D1D5DB') + '">' + starsStr + '</div>';
    h += '</div>';
  }
  h += '</div>';

  var activeDay = null;
  for (var adi = 0; adi < days.length; adi++) {
    var add = days[adi];
    var adp = getDayProgress(add);
    if (adp.unlocked && !adp.completed) { activeDay = add; break; }
  }
  if (activeDay) {
    var adp2 = getDayProgress(activeDay);
    var stepLabel = (adp2.currentStep > 1 && adp2.currentStep <= 5) ? STEP_INFO[adp2.currentStep - 1].label : '开始学习';
    h += '<div style="text-align:center;margin-top:20px"><button class="btn btn-primary btn-lg" onclick="openDay(' + activeDay + ')" style="animation:pulse 2s infinite">' + (adp2.currentStep > 1 ? '▶ 继续 Day ' + activeDay + ' — ' + stepLabel : '🚀 开始 Day ' + activeDay) + '</button></div>';
  }

  container.innerHTML = h;
}

function openDay(dayNum) {
  currentDay = dayNum;
  currentView = 'detail';
  var dp = getDayProgress(dayNum);
  currentStep = dp.currentStep || 1;
  // Reset step-specific state for this day
  vocabCardIdx = 0;
  vocabShowFront = true;
  renderDayDetail(dayNum);
}

function goBackToMap() {
  currentView = 'map';
  currentStep = 1;
  renderDayMap();
}

// ============================================================
// DAY DETAIL (5-Step Learning Flow)
// ============================================================
function renderDayDetail(dayNum) {
  currentView = 'detail';
  currentDay = dayNum;
  var container = document.getElementById('page-daily-learn');
  var dp = getDayProgress(dayNum);
  var dayWords = getDayWords(dayNum);

  var h = '';
  h += '<div class="day-detail-header">';
  h += '<button class="back-btn" onclick="goBackToMap()" title="返回">←</button>';
  h += '<div><div class="day-title">Day ' + dayNum + '</div>';
  h += '<div class="day-subtitle">' + dayWords.length + ' 个单词 · 5步学习流程</div></div>';
  h += '</div>';

  // Step progress bar
  h += '<div class="step-progress-bar">';
  for (var i = 0; i < 5; i++) {
    var s = STEP_INFO[i];
    var stepNum = i + 1;
    var cls = '';
    if (dp.steps && dp.steps[stepNum] && dp.steps[stepNum].done) cls = 'done';
    else if (stepNum === currentStep) cls = 'active';
    if (i > 0) {
      var lineDone = (dp.steps && dp.steps[i] && dp.steps[i].done) ? ' done' : '';
      h += '<div class="step-line' + lineDone + '"></div>';
    }
    h += '<div class="step-dot ' + cls + '" title="' + s.label + '">' + (cls === 'done' ? '✓' : s.icon) + '<span class="step-label">' + s.label + '</span></div>';
  }
  h += '</div>';

  // Step content
  h += '<div class="step-content" id="stepContent">';
  h += renderStepContent(dayNum, currentStep);
  h += '</div>';

  // Navigation
  h += '<div class="step-actions">';
  if (currentStep > 1) {
    h += '<button class="btn btn-outline" onclick="prevStep(' + dayNum + ')">← 上一步</button>';
  } else {
    h += '<span></span>';
  }
  h += '<button class="btn btn-primary" id="btnNextStep" onclick="nextStep(' + dayNum + ')">' + (currentStep < 5 ? '下一步 →' : '完成学习 🎉') + '</button>';
  h += '</div>';

  container.innerHTML = h;
}

function renderStepContent(dayNum, step) {
  switch(step) {
    case 1: return renderStepVocab(dayNum);
    case 2: return renderStepFillBlank(dayNum);
    case 3: return renderStepQuiz(dayNum);
    case 4: return renderStepSpell(dayNum);
    case 5: return renderStepMatch(dayNum);
    default: return '';
  }
}

function prevStep(dayNum) {
  if (currentStep > 1) { currentStep--; var dp = getDayProgress(dayNum); dp.currentStep = currentStep; saveState(); renderDayDetail(dayNum); }
}

function nextStep(dayNum) {
  var dp = getDayProgress(dayNum);
  if (!dp.steps) dp.steps = {};
  if (!dp.steps[currentStep]) dp.steps[currentStep] = {};
  dp.steps[currentStep].done = true;
  if (currentStep < 5) {
    currentStep++;
    dp.currentStep = currentStep;
    saveState();
    renderDayDetail(dayNum);
    document.getElementById('page-daily-learn').scrollIntoView({behavior:'smooth'});
  } else {
    completeDay(dayNum);
  }
}

function completeDay(dayNum) {
  var dp = getDayProgress(dayNum);
  var totalScore = 0, totalMax = 0;
  for (var s = 2; s <= 5; s++) {
    if (dp.steps[s]) { totalScore += dp.steps[s].score || 0; totalMax += dp.steps[s].total || 0; }
  }
  var pct = totalMax > 0 ? totalScore / totalMax : 0;
  var stars = pct >= 0.9 ? 3 : (pct >= 0.7 ? 2 : 1);
  dp.completed = true;
  dp.stars = stars;
  dp.currentStep = 5;
  saveState();
  getDayWords(dayNum).forEach(function(w) {
    if (!appState.wordMastery[w.id] || appState.wordMastery[w.id] < 2) appState.wordMastery[w.id] = 2;
  });
  unlockNextDay(dayNum);
  updateStreak();
  showDayComplete(dayNum, stars, pct);
}

function showDayComplete(dayNum, stars, pct) {
  var overlay = document.createElement('div');
  overlay.className = 'day-complete-overlay';
  overlay.id = 'dayCompleteOverlay';
  var msgs = stars === 3 ? ['太棒了！', '完美通关！', '满分学霸！'] : (stars === 2 ? ['做得不错！', '继续加油！'] : ['完成啦！', '再接再厉！']);
  var msg = msgs[Math.floor(Math.random() * msgs.length)];
  overlay.innerHTML = '<div class="day-complete-card">' +
    '<div class="big-emoji">🎉</div>' +
    '<h2 style="margin:8px 0">' + msg + '</h2>' +
    '<div class="stars-display">' + '⭐'.repeat(stars) + '☆'.repeat(3 - stars) + '</div>' +
    '<div class="score-text">正确率: ' + Math.round(pct * 100) + '%</div>' +
    '<p style="color:var(--text-secondary);font-size:.85rem;margin:8px 0">Day ' + dayNum + ' 完成！</p>' +
    (dayNum < 19 ? '<p style="color:var(--success);font-size:.85rem">🔓 Day ' + (dayNum + 1) + ' 已解锁！</p>' : '<p style="color:var(--primary);font-size:.85rem">🏆 全部19天已完成！</p>') +
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">' +
    '<button class="btn btn-outline" onclick="closeDayComplete();openDay(' + dayNum + ')">📖 复习本天</button>' +
    '<button class="btn btn-primary" onclick="closeDayComplete();goBackToMap()">📅 返回主页</button>' +
    (dayNum < 19 ? '<button class="btn btn-success" onclick="closeDayComplete();openDay(' + (dayNum + 1) + ')">▶ 挑战 Day ' + (dayNum + 1) + '</button>' : '') +
    '</div></div>';
  document.body.appendChild(overlay);
  setTimeout(function() {
    var card = overlay.querySelector('.day-complete-card');
    if (card) { var rect = card.getBoundingClientRect(); spawnParticles(rect.left + rect.width / 2, rect.top + 20, 15); }
  }, 300);
}

function closeDayComplete() {
  var overlay = document.getElementById('dayCompleteOverlay');
  if (overlay) overlay.remove();
  updateHeaderStats();
}

// ============================================================
// STEP 1: VOCABULARY LEARNING (Flashcard + Word List)
// ============================================================
var vocabCardIdx = 0;
var vocabShowFront = true;

function renderStepVocab(dayNum) {
  var words = getDayWords(dayNum);
  if (words.length === 0) return '<p>暂无词汇数据</p>';
  if (vocabCardIdx >= words.length) vocabCardIdx = 0;
  var w = words[vocabCardIdx];
  var allDefs = (w.meanings || []).map(function(m) { return '<span class="tag tag-primary" style="margin:2px">' + m.pos + ' ' + m.def + '</span>'; }).join(' ');
  var derivStr = '';
  if (w.derivatives && w.derivatives.length > 0) {
    derivStr = '<div style="font-size:.8rem;color:var(--text-secondary);margin-top:8px">派生: ' + w.derivatives.map(function(d) { var def = d.def || getDerivativeDef(d.word, w); return d.word + ' <span style="font-size:.7rem;color:var(--text-light)">' + d.pos + '</span>' + (def ? ' <span style="color:var(--text)">' + def + '</span>' : ''); }).join(' &nbsp;|&nbsp; ') + '</div>';
  }
  var phraseStr = '';
  if (w.phrases && w.phrases.length > 0) {
    phraseStr = '<div style="font-size:.75rem;color:var(--text-light);margin-top:4px">' + w.phrases.slice(0, 3).join(' | ') + '</div>';
  }

  var h = '<div style="max-width:500px;margin:0 auto">';
  h += '<div class="flashcard-container" onclick="flipVocabCard()" id="vocabFlashcard" style="height:260px">';
  h += '<div class="flashcard" id="vocabFlashcardInner">';
  h += '<div class="flashcard-face flashcard-front"><div class="fc-word">' + w.word + '</div><div class="fc-hint">点击翻转查看释义</div></div>';
  h += '<div class="flashcard-face flashcard-back"><div style="font-size:1.6rem;font-weight:700;margin-bottom:8px;color:var(--primary)">' + w.word + '</div><div style="font-size:.95rem;color:var(--text)">' + allDefs + '</div>' + derivStr + phraseStr + '</div>';
  h += '</div></div>';

  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">';
  h += '<button class="btn btn-sm btn-ghost" onclick="prevVocabCard(' + dayNum + ')"' + (vocabCardIdx === 0 ? ' disabled' : '') + '>◀</button>';
  h += '<span style="font-size:.85rem;color:var(--text-secondary)">' + (vocabCardIdx + 1) + ' / ' + words.length + '</span>';
  h += '<button class="btn btn-sm btn-ghost" onclick="nextVocabCard(' + dayNum + ')"' + (vocabCardIdx >= words.length - 1 ? ' disabled' : '') + '>▶</button>';
  h += '</div>';

  h += '<div style="margin-top:16px;max-height:200px;overflow-y:auto">';
  h += '<div style="font-size:.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px">本天词汇列表 (点击切换)</div>';
  for (var i = 0; i < words.length; i++) {
    var ww = words[i];
    var def = (ww.meanings && ww.meanings.length > 0) ? ww.meanings[0].def : '';
    var active = i === vocabCardIdx;
    h += '<div style="padding:6px 10px;cursor:pointer;border-radius:6px;' + (active ? 'background:var(--primary-bg);font-weight:700' : '') + '" onclick="jumpVocabCard(' + dayNum + ',' + i + ')">';
    h += '<span style="font-family:monospace;font-weight:600">' + ww.word + '</span> <span style="color:var(--text-secondary);font-size:.8rem">' + def + '</span></div>';
  }
  h += '</div></div>';
  return h;
}

function flipVocabCard() {
  var inner = document.getElementById('vocabFlashcardInner');
  if (inner) { vocabShowFront = !vocabShowFront; inner.classList.toggle('flipped', !vocabShowFront); }
}

function prevVocabCard(dayNum) {
  if (vocabCardIdx > 0) { vocabCardIdx--; vocabShowFront = true; refreshVocabStep(dayNum); }
}

function nextVocabCard(dayNum) {
  var words = getDayWords(dayNum);
  if (vocabCardIdx < words.length - 1) { vocabCardIdx++; vocabShowFront = true; refreshVocabStep(dayNum); }
}

function jumpVocabCard(dayNum, idx) {
  vocabCardIdx = idx; vocabShowFront = true; refreshVocabStep(dayNum);
}

function refreshVocabStep(dayNum) {
  var el = document.getElementById('stepContent');
  if (el) el.innerHTML = renderStepVocab(dayNum);
}

// ============================================================
// STEP 2: SENTENCE FILL-BLANK (语境填空)
// ============================================================
var fillblankState = {};

function renderStepFillBlank(dayNum) {
  var exData = getDayExerciseData(dayNum);
  var words = getDayWords(dayNum);
  if (!fillblankState[dayNum]) fillblankState[dayNum] = { idx: 0, answers: {}, submitted: false, score: 0, results: {} };
  var fb = fillblankState[dayNum];

  var exercises = [];
  if (exData.length > 0) {
    exData.forEach(function(item) {
      item.exercises.filter(function(e) { return e.type === 'context'; }).forEach(function(e) {
        exercises.push({ wordId: item.wordId, word: item.word, sentence: e.sentence, answer: e.answer, options: e.options, hint: e.hint, pos: e.pos });
      });
    });
  }
  if (exercises.length === 0) {
    words.forEach(function(w) {
      var def = (w.meanings && w.meanings.length > 0) ? w.meanings[0].def : '';
      var pos = (w.meanings && w.meanings.length > 0) ? w.meanings[0].pos : '';
      var dists = getRandomDistractors(w, 3).map(function(d) { return d.word; });
      exercises.push({ wordId: w.id, word: w.word, sentence: 'The word "___" means ' + def + '.', answer: w.word, options: [w.word].concat(dists), hint: def, pos: pos });
    });
  }

  if (fb.idx >= exercises.length) fb.idx = 0;
  var ex = exercises[fb.idx];
  var userAnswer = fb.answers[fb.idx] || '';
  var result = fb.results[fb.idx];

  var h = '<div style="max-width:600px;margin:0 auto">';
  h += '<div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">第 ' + (fb.idx + 1) + ' / ' + exercises.length + ' 题 · 根据语境填入正确的单词</div>';
  h += '<div class="sentence-exercise">';
  if (ex.pos) h += '<span class="sent-pos">' + ex.pos + '</span>';

  if (fb.submitted) {
    var cls = (result && result.correct) ? 'correct' : 'wrong';
    h += '<div class="sent-text">' + ex.sentence.replace('___', '<span class="blank filled ' + cls + '">' + (userAnswer || '___') + '</span>');
    if (!result || !result.correct) h += ' <span style="color:var(--success);font-weight:700">(' + ex.answer + ')</span>';
    h += '</div>';
  } else {
    h += '<div class="sent-text">' + ex.sentence.replace('___', '<span class="blank' + (userAnswer ? ' filled' : '') + '">' + (userAnswer || '___') + '</span>') + '</div>';
  }
  if (ex.hint) h += '<div class="sent-hint">💡 提示: ' + ex.hint + '</div>';
  h += '</div>';

  if (!fb.submitted) {
    if (ex.options && ex.options.length >= 2) {
      h += '<div class="choice-grid">';
      ex.options.forEach(function(opt) {
        var sel = userAnswer === opt ? ' selected' : '';
        h += '<button class="choice-btn' + sel + '" onclick="selectFillblank(' + dayNum + ',' + fb.idx + ',\'' + opt.replace(/'/g, "\\'") + '\')">' + opt + '</button>';
      });
      h += '</div>';
    } else {
      h += '<div class="spell-input-row" style="margin-top:12px"><input class="input" id="fillblankInput" type="text" placeholder="输入单词..." value="' + (userAnswer || '') + '" onkeydown="if(event.key===\'Enter\')submitFillblank(' + dayNum + ')"><button class="btn btn-primary" onclick="submitFillblank(' + dayNum + ')">确认</button></div>';
    }
  } else {
    var isCorrect = result && result.correct;
    h += '<div style="text-align:center;margin-top:16px;font-size:1.1rem;' + (isCorrect ? 'color:var(--success)' : 'color:var(--danger)') + '">' + (isCorrect ? '✅ 正确!' : '❌ 正确答案: ' + ex.answer) + '</div>';
  }

  h += '<div style="display:flex;justify-content:space-between;margin-top:16px">';
  h += '<button class="btn btn-sm btn-ghost" onclick="prevFillblank(' + dayNum + ')"' + (fb.idx === 0 ? ' disabled' : '') + '>◀ 上一题</button>';
  if (fb.submitted) {
    h += '<button class="btn btn-sm btn-primary" onclick="nextFillblank(' + dayNum + ',' + exercises.length + ')">下一题 ▶</button>';
  } else if (ex.options && ex.options.length >= 2) {
    h += '<button class="btn btn-sm btn-primary" onclick="submitFillblankChoice(' + dayNum + ',' + fb.idx + ')"' + (!userAnswer ? ' disabled' : '') + '>提交</button>';
  }
  h += '</div></div>';
  return h;
}

function selectFillblank(dayNum, idx, word) {
  if (!fillblankState[dayNum]) return;
  fillblankState[dayNum].answers[idx] = word;
  refreshFillblankStep(dayNum);
}

function submitFillblank(dayNum) {
  var input = document.getElementById('fillblankInput');
  if (!input || !fillblankState[dayNum]) return;
  var fb = fillblankState[dayNum];
  fb.answers[fb.idx] = input.value.trim();
  fb.submitted = true;
  checkFillblankAnswer(dayNum);
  refreshFillblankStep(dayNum);
}

function submitFillblankChoice(dayNum, idx) {
  if (!fillblankState[dayNum]) return;
  fillblankState[dayNum].submitted = true;
  checkFillblankAnswer(dayNum);
  refreshFillblankStep(dayNum);
}

function checkFillblankAnswer(dayNum) {
  var fb = fillblankState[dayNum];
  var exData = getDayExerciseData(dayNum);
  var words = getDayWords(dayNum);
  var exercises = [];
  if (exData.length > 0) {
    exData.forEach(function(item) {
      item.exercises.filter(function(e) { return e.type === 'context'; }).forEach(function(e) {
        exercises.push({ wordId: item.wordId, word: item.word, sentence: e.sentence, answer: e.answer, options: e.options, hint: e.hint, pos: e.pos });
      });
    });
  }
  if (exercises.length === 0) {
    words.forEach(function(w) {
      var def = (w.meanings && w.meanings.length > 0) ? w.meanings[0].def : '';
      var pos = (w.meanings && w.meanings.length > 0) ? w.meanings[0].pos : '';
      var dists = getRandomDistractors(w, 3).map(function(d) { return d.word; });
      exercises.push({ wordId: w.id, word: w.word, sentence: 'The word "___" means ' + def + '.', answer: w.word, options: [w.word].concat(dists), hint: def, pos: pos });
    });
  }
  var ex = exercises[fb.idx];
  var userAnswer = (fb.answers[fb.idx] || '').trim().toLowerCase();
  var correct = userAnswer === ex.answer.toLowerCase();
  fb.results[fb.idx] = { correct: correct, userAnswer: userAnswer };
  if (correct) fb.score++;
  var dp = getDayProgress(dayNum);
  if (!dp.steps) dp.steps = {};
  dp.steps[2] = { done: fb.idx >= exercises.length - 1, score: fb.score, total: fb.idx + 1 };
  saveState();
  if (!correct) {
    var w = getWordById(ex.wordId);
    if (w && appState.wrongWords.indexOf(w.id) === -1) { appState.wrongWords.push(w.id); saveState(); }
  }
}

function prevFillblank(dayNum) {
  if (!fillblankState[dayNum]) return;
  var fb = fillblankState[dayNum];
  if (fb.idx > 0) { fb.idx--; fb.submitted = !!fb.results[fb.idx]; refreshFillblankStep(dayNum); }
}

function nextFillblank(dayNum, total) {
  if (!fillblankState[dayNum]) return;
  var fb = fillblankState[dayNum];
  if (fb.idx < total - 1) { fb.idx++; fb.submitted = !!fb.results[fb.idx]; refreshFillblankStep(dayNum); }
}

function refreshFillblankStep(dayNum) {
  var el = document.getElementById('stepContent');
  if (el) el.innerHTML = renderStepFillBlank(dayNum);
}

// ============================================================
// STEP 3: MULTIPLE CHOICE QUIZ
// ============================================================
var quizDayState = {};

function renderStepQuiz(dayNum) {
  var words = getDayWords(dayNum);
  if (words.length === 0) return '<p>暂无词汇</p>';
  if (!quizDayState[dayNum]) {
    var questions = [];
    words.forEach(function(w) {
      var def = (w.meanings && w.meanings.length > 0) ? w.meanings[0].def : '';
      var mode = Math.random() > 0.5 ? 'en2zh' : 'zh2en';
      if (mode === 'en2zh') {
        var distractors = getRandomDistractors(w, 3);
        questions.push({ wordId: w.id, word: w.word, mode: 'en2zh', question: w.word, answer: def, options: [def].concat(distractors.map(function(d) { return (d.meanings && d.meanings[0]) ? d.meanings[0].def : d.word; })).sort(function() { return Math.random() - 0.5; }) });
      } else {
        var dists2 = getRandomDistractors(w, 3);
        questions.push({ wordId: w.id, word: w.word, mode: 'zh2en', question: def, answer: w.word, options: [w.word].concat(dists2.map(function(d) { return d.word; })).sort(function() { return Math.random() - 0.5; }) });
      }
    });
    quizDayState[dayNum] = { idx: 0, score: 0, total: questions.length, questions: questions, results: [] };
  }
  var qs = quizDayState[dayNum];
  if (qs.idx >= qs.questions.length) qs.idx = 0;
  var q = qs.questions[qs.idx];
  var result = qs.results[qs.idx];

  var h = '<div style="max-width:550px;margin:0 auto">';
  h += '<div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">第 ' + (qs.idx + 1) + ' / ' + qs.questions.length + ' 题</div>';
  h += '<div class="card" style="text-align:center;padding:24px;margin-bottom:16px">';
  h += '<div style="font-size:.75rem;color:var(--text-light);margin-bottom:4px">' + (q.mode === 'en2zh' ? '选择正确的中文释义' : '选择对应的英文单词') + '</div>';
  h += '<div style="font-size:1.6rem;font-weight:700;color:var(--primary)">' + q.question + '</div></div>';
  h += '<div class="choice-grid">';
  q.options.forEach(function(opt) {
    var cls = '';
    if (result) {
      if (opt === q.answer) cls = ' correct';
      else if (opt === result.selected && !result.correct) cls = ' wrong';
    } else if (qs.selected === opt) cls = ' selected';
    h += '<button class="choice-btn' + cls + '" onclick="answerQuizDay(' + dayNum + ',\'' + opt.replace(/'/g, "\\'") + '\')"' + (result ? ' disabled' : '') + '>' + opt + '</button>';
  });
  h += '</div>';
  if (result) {
    h += '<div style="text-align:center;margin-top:16px;font-size:1.1rem;' + (result.correct ? 'color:var(--success)' : 'color:var(--danger)') + '">' + (result.correct ? '✅ 正确!' : '❌ 正确答案: ' + q.answer) + '</div>';
  }
  h += '<div style="display:flex;justify-content:space-between;margin-top:16px">';
  h += '<button class="btn btn-sm btn-ghost" onclick="prevQuizDay(' + dayNum + ')"' + (qs.idx === 0 ? ' disabled' : '') + '>◀ 上一题</button>';
  h += '<span style="font-size:.85rem;color:var(--text-secondary)">得分: ' + qs.score + ' / ' + qs.results.length + '</span>';
  h += '<button class="btn btn-sm btn-primary" onclick="nextQuizDay(' + dayNum + ')"' + (!result ? ' disabled' : '') + '>下一题 ▶</button>';
  h += '</div></div>';
  return h;
}

function answerQuizDay(dayNum, selected) {
  var qs = quizDayState[dayNum];
  if (!qs) return;
  var q = qs.questions[qs.idx];
  var correct = selected === q.answer;
  if (correct) qs.score++;
  qs.results[qs.idx] = { selected: selected, correct: correct };
  if (!correct) {
    var w = getWordById(q.wordId);
    if (w && appState.wrongWords.indexOf(w.id) === -1) { appState.wrongWords.push(w.id); saveState(); }
  }
  var dp = getDayProgress(dayNum);
  if (!dp.steps) dp.steps = {};
  dp.steps[3] = { done: qs.results.length >= qs.questions.length, score: qs.score, total: qs.results.length };
  saveState();
  refreshQuizStep(dayNum);
}

function prevQuizDay(dayNum) {
  var qs = quizDayState[dayNum];
  if (qs && qs.idx > 0) { qs.idx--; refreshQuizStep(dayNum); }
}

function nextQuizDay(dayNum) {
  var qs = quizDayState[dayNum];
  if (!qs) return;
  if (qs.idx < qs.questions.length - 1) { qs.idx++; refreshQuizStep(dayNum); }
}

function refreshQuizStep(dayNum) {
  var el = document.getElementById('stepContent');
  if (el) el.innerHTML = renderStepQuiz(dayNum);
}

// ============================================================
// STEP 4: SPELLING PRACTICE
// ============================================================
var spellDayState = {};

function renderStepSpell(dayNum) {
  var words = getDayWords(dayNum);
  if (words.length === 0) return '<p>暂无词汇</p>';
  if (!spellDayState[dayNum]) {
    var items = words.map(function(w) {
      return { wordId: w.id, word: w.word, hint: (w.meanings && w.meanings[0]) ? w.meanings[0].def : '', pos: (w.meanings && w.meanings[0]) ? w.meanings[0].pos : '' };
    }).sort(function() { return Math.random() - 0.5; });
    spellDayState[dayNum] = { idx: 0, score: 0, total: items.length, items: items, results: [], submitted: false };
  }
  var ss = spellDayState[dayNum];
  if (ss.idx >= ss.items.length) ss.idx = 0;
  var item = ss.items[ss.idx];
  var result = ss.results[ss.idx];

  var h = '<div style="max-width:500px;margin:0 auto">';
  h += '<div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">第 ' + (ss.idx + 1) + ' / ' + ss.items.length + ' 题 · 根据中文释义拼写英文单词</div>';
  h += '<div class="card" style="text-align:center;padding:24px;margin-bottom:16px"><div style="font-size:.75rem;color:var(--text-light)">' + item.pos + '</div><div style="font-size:2rem;font-weight:700;color:var(--text);margin:12px 0">' + item.hint + '</div></div>';

  if (!result || !result.submitted) {
    h += '<div class="spell-input-row"><input class="input" id="spellDayInput" type="text" placeholder="输入英文单词..." autocomplete="off" onkeydown="if(event.key===\'Enter\')submitSpellDay(' + dayNum + ')"><button class="btn btn-primary" onclick="submitSpellDay(' + dayNum + ')">确认</button></div>';
    h += '<div style="text-align:center;margin-top:8px"><button class="btn btn-sm btn-ghost" onclick="showSpellHint(' + dayNum + ')">💡 显示提示</button><div id="spellHintArea" style="font-size:.85rem;color:var(--text-secondary);margin-top:4px"></div></div>';
  } else {
    var correct = result.correct;
    h += '<div style="text-align:center;margin-top:16px"><div style="font-size:1.2rem;' + (correct ? 'color:var(--success)' : 'color:var(--danger)') + '">' + (correct ? '✅ 正确!' : '❌ 正确答案: <b>' + item.word + '</b>') + '</div><div style="font-size:.9rem;color:var(--text-secondary);margin-top:4px">你的输入: ' + (result.userInput || '') + '</div></div>';
  }

  h += '<div style="display:flex;justify-content:space-between;margin-top:16px">';
  h += '<button class="btn btn-sm btn-ghost" onclick="prevSpellDay(' + dayNum + ')"' + (ss.idx === 0 ? ' disabled' : '') + '>◀ 上一题</button>';
  h += '<span style="font-size:.85rem;color:var(--text-secondary)">得分: ' + ss.score + ' / ' + ss.results.filter(function(r) { return r && r.submitted; }).length + '</span>';
  h += '<button class="btn btn-sm btn-primary" onclick="nextSpellDay(' + dayNum + ')"' + (!result || !result.submitted ? ' disabled' : '') + '>下一题 ▶</button>';
  h += '</div></div>';
  return h;
}

function showSpellHint(dayNum) {
  var ss = spellDayState[dayNum];
  if (!ss) return;
  var item = ss.items[ss.idx];
  var el = document.getElementById('spellHintArea');
  if (el) el.textContent = '首字母: ' + item.word[0].toUpperCase() + '... 长度: ' + item.word.length + ' 个字母';
}

function submitSpellDay(dayNum) {
  var input = document.getElementById('spellDayInput');
  if (!input || !spellDayState[dayNum]) return;
  var ss = spellDayState[dayNum];
  var item = ss.items[ss.idx];
  var userInput = input.value.trim();
  var correct = userInput.toLowerCase() === item.word.toLowerCase();
  if (correct) ss.score++;
  ss.results[ss.idx] = { submitted: true, correct: correct, userInput: userInput };
  if (!correct) {
    var w = getWordById(item.wordId);
    if (w && appState.wrongWords.indexOf(w.id) === -1) { appState.wrongWords.push(w.id); saveState(); }
  }
  var dp = getDayProgress(dayNum);
  if (!dp.steps) dp.steps = {};
  var doneCount = ss.results.filter(function(r) { return r && r.submitted; }).length;
  dp.steps[4] = { done: doneCount >= ss.total, score: ss.score, total: doneCount };
  saveState();
  refreshSpellStep(dayNum);
}

function prevSpellDay(dayNum) {
  var ss = spellDayState[dayNum];
  if (ss && ss.idx > 0) { ss.idx--; refreshSpellStep(dayNum); }
}

function nextSpellDay(dayNum) {
  var ss = spellDayState[dayNum];
  if (ss && ss.idx < ss.items.length - 1) { ss.idx++; refreshSpellStep(dayNum); }
}

function refreshSpellStep(dayNum) {
  var el = document.getElementById('stepContent');
  if (el) el.innerHTML = renderStepSpell(dayNum);
}

// ============================================================
// STEP 5: MATCHING GAME
// ============================================================
var matchDayState = {};

function renderStepMatch(dayNum) {
  var words = getDayWords(dayNum);
  if (words.length === 0) return '<p>暂无词汇</p>';
  if (!matchDayState[dayNum]) {
    var pairs = words.map(function(w) {
      return { wordId: w.id, eng: w.word, chn: (w.meanings && w.meanings[0]) ? w.meanings[0].def : '' };
    });
    matchDayState[dayNum] = { pairs: pairs, matched: [], selected: null, score: 0, total: pairs.length, cardMap: [] };
  }
  var ms = matchDayState[dayNum];

  var cards = [];
  ms.pairs.forEach(function(p, i) {
    cards.push({ pairIdx: i, type: 'eng', text: p.eng, matched: ms.matched.indexOf(i) !== -1 });
    cards.push({ pairIdx: i, type: 'chn', text: p.chn, matched: ms.matched.indexOf(i) !== -1 });
  });
  for (var i = cards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
  }
  // Store shuffled cards for selection logic
  ms.cardMap = cards;

  var h = '<div style="max-width:650px;margin:0 auto">';
  h += '<div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">点击英文单词和对应的中文释义进行配对 · 已配对: ' + ms.matched.length + ' / ' + ms.total + '</div>';
  h += '<div class="match-pair-grid">';
  cards.forEach(function(card, i) {
    var cls = 'match-pair-card ' + (card.type === 'eng' ? 'eng' : 'chn');
    if (card.matched) cls += ' matched';
    if (ms.selected && ms.selected.idx === i) cls += ' selected';
    h += '<div class="' + cls + '" id="matchCard' + i + '" onclick="selectMatchCard(' + dayNum + ',' + i + ')">' + card.text + '</div>';
  });
  h += '</div>';
  if (ms.matched.length >= ms.total) {
    h += '<div style="text-align:center;margin-top:20px;font-size:1.2rem;color:var(--success)">🎉 全部配对完成!</div>';
  }
  h += '</div>';
  return h;
}

function selectMatchCard(dayNum, cardIdx) {
  var ms = matchDayState[dayNum];
  if (!ms) return;
  var card = ms.cardMap[cardIdx];
  if (!card || card.matched) return;

  if (!ms.selected) {
    ms.selected = { idx: cardIdx, pairIdx: card.pairIdx, type: card.type };
    refreshMatchStep(dayNum);
    return;
  }

  if (ms.selected.idx === cardIdx) {
    ms.selected = null;
    refreshMatchStep(dayNum);
    return;
  }

  if (ms.selected.pairIdx === card.pairIdx && ms.selected.type !== card.type) {
    ms.matched.push(card.pairIdx);
    ms.score++;
    ms.selected = null;
    var dp = getDayProgress(dayNum);
    if (!dp.steps) dp.steps = {};
    dp.steps[5] = { done: ms.matched.length >= ms.total, score: ms.score, total: ms.total };
    saveState();
    refreshMatchStep(dayNum);
  } else {
    // Wrong match — flash red briefly
    var el1 = document.getElementById('matchCard' + ms.selected.idx);
    var el2 = document.getElementById('matchCard' + cardIdx);
    if (el1) el1.classList.add('wrong-pair');
    if (el2) el2.classList.add('wrong-pair');
    var prevSelected = ms.selected;
    ms.selected = null;
    setTimeout(function() {
      if (el1) el1.classList.remove('wrong-pair');
      if (el2) el2.classList.remove('wrong-pair');
      refreshMatchStep(dayNum);
    }, 400);
  }
}

function refreshMatchStep(dayNum) {
  var el = document.getElementById('stepContent');
  if (el) el.innerHTML = renderStepMatch(dayNum);
}

// CLOZE PAGE (短文完型)
// ============================================================
let clozeViewState = null; // {passage, userAnswers, submitted, score}

function renderClozePage() {
  const container = document.getElementById('page-cloze');
  if (clozeViewState) {
    renderClozePassage();
    return;
  }

  if (CLOZE_TESTS.length === 0) {
    container.innerHTML = `<div class="card text-center" style="padding:40px">
      <p style="font-size:3rem">📝</p>
      <h3>短文完型数据加载中...</h3>
      <p style="color:var(--text-secondary)">真题数据正在解析，请刷新页面重试</p>
    </div>`;
    return;
  }

  let html = `<h2 style="margin-bottom:16px">📝 短文完型填空</h2>
    <p style="margin-bottom:12px;color:var(--text-secondary)">共 ${CLOZE_TESTS.length} 篇中考真题，选择最佳答案填入空白处</p>
    <div class="grid grid-2">`;

  for (const p of CLOZE_TESTS) {
    const result = appState.clozeResults[p.id];
    const statusIcon = result ? (result.score === result.total ? '✅' : '📖') : '⬜';
    html += `<div class="card" style="cursor:pointer" onclick="openClozePassage(${p.id})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700">${statusIcon} ${p.title}</div>
          <div style="font-size:.8rem;color:var(--text-secondary)">${p.questionCount || '?'} 题</div>
        </div>
        ${result ? `<div style="text-align:right"><div style="font-weight:700;color:var(--primary)">${result.score}/${result.total}</div><div style="font-size:.7rem;color:var(--text-secondary)">${result.date}</div></div>` : '<div style="color:var(--text-light)">未做</div>'}
      </div>
    </div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

function openClozePassage(id) {
  const passage = CLOZE_TESTS.find(p => p.id === id);
  if (!passage) return;
  clozeViewState = { passage, userAnswers: {}, submitted: false, score: 0 };
  renderClozePassage();
}

function renderClozePassage() {
  const container = document.getElementById('page-cloze');
  if (!clozeViewState) { renderClozePage(); return; }

  const p = clozeViewState.passage;
  const submitted = clozeViewState.submitted;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <button class="btn btn-ghost btn-sm" onclick="clozeViewState=null;renderClozePage()">← 返回列表</button>
    <h2 style="margin:0">${p.title}</h2>
    ${submitted ? `<span class="tag tag-success">得分: ${clozeViewState.score}/${p.questionCount}</span>` : ''}
  </div>`;

  // Render each section
  for (const section of p.sections) {
    if (section.type === 'paragraph') {
      // Parse blanks in text
      let text = section.text;
      // Replace __BLANK_XX__ with interactive/display blanks
      const blankRegex = /__BLANK_(\d+)__/g;
      let match;
      let lastIdx = 0;
      let processed = '';

      while ((match = blankRegex.exec(text)) !== null) {
        processed += escapeHtml(text.slice(lastIdx, match.index));
        const num = parseInt(match[1]);
        const userAns = clozeViewState.userAnswers[num];
        const correctAns = getClozeAnswer(p.id, num);
        let blankClass = '';
        let displayText = num;
        if (submitted) {
          if (userAns === correctAns) blankClass = 'answered';
          else blankClass = 'wrong-blank';
        } else if (userAns) {
          blankClass = 'answered';
        }
        displayText = userAns || num;
        processed += `<span class="cloze-blank ${blankClass}" onclick="jumpToClozeQuestion(${num})" id="blank-${num}">
          <span class="blank-num">${num}</span>${displayText}</span>`;
        lastIdx = match.index + match[0].length;
      }
      processed += escapeHtml(text.slice(lastIdx));
      html += `<div class="card cloze-passage">${processed}</div>`;
    } else if (section.type === 'question_block') {
      html += `<div class="card mt-2">`;
      html += `<div style="font-weight:700;margin-bottom:8px">请选择答案：</div>`;
      for (const q of section.items) {
        const userAns = clozeViewState.userAnswers[q.number];
        const correctAns = q.answer;
        html += `<div style="margin-bottom:10px;padding:8px;border-radius:8px;background:var(--bg)" id="qrow-${q.number}">
          <div style="font-weight:600;margin-bottom:4px">第 ${q.number} 题</div>
          <div class="cloze-options-panel">`;
        for (const [key, val] of Object.entries(q.options)) {
          let optClass = 'cloze-opt-btn';
          if (submitted) {
            if (key === correctAns) optClass += ' correct-ans';
            if (key === userAns && key !== correctAns) optClass += ' wrong-ans';
          } else if (key === userAns) {
            optClass += ' chosen';
          }
          html += `<button class="${optClass}" ${submitted?'disabled':''}
            onclick="selectClozeOption(${q.number},'${key}')"
            id="opt-${q.number}-${key}">${key}. ${escapeHtml(val)}</button>`;
        }
        html += `</div>`;
        if (submitted) {
          const isCorrect = userAns === correctAns;
          html += `<div style="font-size:.8rem;margin-top:4px;color:${isCorrect?'var(--success)':'var(--danger)'}">
            ${isCorrect ? '✅ 正确' : `❌ 错误，正确答案是 ${correctAns}`}</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
  }

  // Submit / Reset buttons
  html += `<div class="flex flex-center gap-2 mt-3">`;
  if (!submitted) {
    html += `<button class="btn btn-primary btn-lg" onclick="submitClozeAnswers()">提交答案</button>`;
  }
  html += `<button class="btn btn-outline" onclick="resetClozePassage()">${submitted?'重做':'重置'}</button>
  </div>`;

  container.innerHTML = html;
}

function selectClozeOption(num, key) {
  if (clozeViewState.submitted) return;
  clozeViewState.userAnswers[num] = key;
  renderClozePassage();
  // Scroll to the blank
  setTimeout(() => {
    const blank = document.getElementById('blank-' + num);
    if (blank) blank.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function jumpToClozeQuestion(num) {
  const qrow = document.getElementById('qrow-' + num);
  if (qrow) qrow.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function getClozeAnswer(passageId, num) {
  const passage = CLOZE_TESTS.find(p => p.id === passageId);
  if (!passage) return null;
  for (const section of passage.sections) {
    if (section.type === 'question_block') {
      for (const q of section.items) {
        if (q.number === num) return q.answer;
      }
    }
  }
  return null;
}

function submitClozeAnswers() {
  const p = clozeViewState.passage;
  let score = 0;
  let total = 0;
  for (const section of p.sections) {
    if (section.type === 'question_block') {
      for (const q of section.items) {
        total++;
        if (clozeViewState.userAnswers[q.number] === q.answer) score++;
      }
    }
  }
  clozeViewState.submitted = true;
  clozeViewState.score = score;

  // Save result
  appState.clozeResults[p.id] = { score, total, date: new Date().toISOString().slice(0,10) };
  saveState();
  updateStreak();
  updateHeaderStats();

  if (score === total) {
    showToast('🎉 全部正确！太棒了！', 'success');
    // Spawn particles
    setTimeout(() => {
      const el = document.getElementById('page-cloze');
      if (el) { const rect = el.getBoundingClientRect(); spawnParticles(rect.left+rect.width/2, rect.top+100, 15); }
    }, 300);
  } else {
    showToast(`得分: ${score}/${total}`, 'info');
  }

  renderClozePassage();
}

function resetClozePassage() {
  clozeViewState.userAnswers = {};
  clozeViewState.submitted = false;
  clozeViewState.score = 0;
  renderClozePassage();
}

  let html = `<h2 style="margin-bottom:16px">📊 学习统计</h2>`;

  html += `<div class="grid grid-3">
    <div class="card stat-card">
      <div class="stat-value" style="color:var(--primary)">${learned}</div>
      <div class="stat-label">已学单词 / ${total}</div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${learnedPct}%"></div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-value" style="color:var(--success)">${mastered}</div>
      <div class="stat-label">已掌握</div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${masteredPct}%;background:var(--success)"></div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-value" style="color:var(--warning)">${appState.streak.current}</div>
      <div class="stat-label">连续学习天数</div>
      <div style="font-size:.75rem;color:var(--text-secondary)">最佳: ${appState.streak.best}天</div>
    </div>
  </div>`;

  // Day progress
  const wordsByDay = getWordsByDay();
  const days = Object.keys(wordsByDay).map(Number).sort((a,b) => a-b);
  html += `<div class="card mt-2"><div class="card-header">📅 每日进度</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">`;
  for (const d of days) {
    const dayWords = wordsByDay[d];
    const dayLearned = dayWords.filter(w => (appState.wordMastery[w.id]||0) > 0).length;
    const dayMastered = dayWords.filter(w => (appState.wordMastery[w.id]||0) === 2).length;
    const dayPct = Math.round(dayLearned / dayWords.length * 100);
    html += `<div style="padding:8px;background:var(--bg);border-radius:8px">
      <div style="font-size:.8rem;font-weight:700">Day ${d} <span style="color:var(--text-secondary);font-weight:400">(${dayWords.length}词)</span></div>
      <div style="font-size:.75rem;color:var(--text-secondary)">已学 ${dayLearned} | 掌握 ${dayMastered}</div>
      <div class="progress-bar" style="height:4px"><div class="progress-bar-fill" style="width:${dayPct}%"></div></div>
    </div>`;
  }
  html += `</div></div>`;

  // Quiz history
  html += `<div class="grid grid-2 mt-2">
    <div class="card">
      <div class="card-header">📋 测验历史</div>`;
  if (appState.quizHistory.length === 0) {
    html += `<p style="color:var(--text-secondary);font-size:.85rem">暂无记录</p>`;
  } else {
    html += `<div style="max-height:200px;overflow-y:auto">`;
    const reversed = [...appState.quizHistory].reverse().slice(0, 15);
    for (const h of reversed) {
      const pct = Math.round(h.score / h.total * 100);
      html += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem;display:flex;justify-content:space-between">
        <span>${h.mode==='en2zh'?'英→中':h.mode==='zh2en'?'中→英':h.mode==='mixed'?'混合':'错题'}</span>
        <span style="font-weight:700;color:${pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--danger)'}">${h.score}/${h.total} (${pct}%)</span>
        <span style="color:var(--text-light)">${h.date}</span>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  // Wrong words notebook
  html += `<div class="card">
    <div class="card-header">🔴 错词本 <span class="tag tag-danger">${appState.wrongWords.length}词</span></div>`;
  if (appState.wrongWords.length === 0) {
    html += `<p style="color:var(--text-secondary);font-size:.85rem">🎉 没有错词，继续保持！</p>`;
  } else {
    html += `<div style="max-height:200px;overflow-y:auto">`;
    const wrongWordObjs = appState.wrongWords.map(id => getWordById(id)).filter(Boolean);
    for (const w of wrongWordObjs) {
      const def = w.meanings && w.meanings.length > 0 ? w.meanings[0].def : '';
      html += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem;display:flex;justify-content:space-between;align-items:center">
        <span><span class="word-en-style">${w.word}</span> <span style="color:var(--text-secondary)">${def}</span></span>
        <button class="btn btn-sm btn-outline" onclick="setMastery(${w.id},2);appState.wrongWords=appState.wrongWords.filter(id=>id!==${w.id});saveState();renderStatsPage()">✓ 已掌握</button>
      </div>`;
    }
    html += `</div>
      <button class="btn btn-warning btn-sm mt-1" onclick="startQuiz('wrong')">🔴 错题重练</button>`;
  }
  html += `</div></div>`;

  // Cloze results
  if (Object.keys(appState.clozeResults).length > 0) {
    html += `<div class="card mt-2">
      <div class="card-header">📝 完型练习记录</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">`;
    for (const [pid, result] of Object.entries(appState.clozeResults)) {
      const passage = CLOZE_TESTS.find(p => p.id === parseInt(pid));
      const pct = Math.round(result.score / result.total * 100);
      html += `<div style="padding:8px;background:var(--bg);border-radius:8px;font-size:.8rem">
        <div style="font-weight:700">${passage?passage.title:'真题'+pid}</div>
        <div style="color:${pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--danger)'}">${result.score}/${result.total} (${pct}%)</div>
        <div style="color:var(--text-light)">${result.date}</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Data management
  html += `<div class="card mt-2">
    <div class="card-header">⚙️ 数据管理</div>
    <div class="flex gap-1" style="flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出数据</button>
      <button class="btn btn-outline btn-sm" onclick="importDataPrompt()">📥 导入数据</button>
      <button class="btn btn-danger btn-sm" onclick="resetAllData()">⚠️ 重置所有数据</button>
    </div>
  </div>`;

  container.innerHTML = html;
}

function exportData() {
  const data = JSON.stringify(appState, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'english_vocab_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出','success');
}

function importDataPrompt() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        appState = {...defaultState(), ...data};
        saveState();
        updateHeaderStats();
        renderStatsPage();
        showToast('数据已导入','success');
      } catch(ex) {
        showToast('导入失败：文件格式错误','error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAllData() {
  if (confirm('确定要重置所有学习数据吗？此操作不可恢复！')) {
    appState = defaultState();
    saveState();
    updateHeaderStats();
    renderStatsPage();
    showToast('数据已重置','info');
  }
}
